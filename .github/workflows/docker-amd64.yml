# Build & publish the amd64 (x86_64) docker image
name: Docker (amd64)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set image name
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=ghcr.io/${repo}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=https://github.com/${repo}/pkgs/container/${repo#*/}" >> "$GITHUB_ENV"
      -
        name: Compute image tags
        id: tags
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          tags="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="${IMAGE_NAME}:${version},${IMAGE_NAME}:${version%.*},${tags}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tags="${IMAGE_NAME}:pr-${PR_NUMBER},${tags}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            tags="${IMAGE_NAME}:latest,${IMAGE_NAME}:main,${tags}"
          else
            tags="${IMAGE_NAME}:${GITHUB_REF_NAME//\//-},${tags}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION_TAG=${{ github.ref_name }}
      -
        name: Add image info to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          found=false
          for _ in {1..30}; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 2
          done

          if [[ "${found}" != "true" ]]; then
            echo "::warning::No GitHub release found for ${GITHUB_REF_NAME}; skipping."
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          body="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body | sed '/^<!-- docker-image -->$/,$d')"
          notes="${body}

          <!-- docker-image -->
          ## Docker image

          - Image: [\`${IMAGE_NAME}:${version}\`](${IMAGE_URL})
          - Digest: \`${DIGEST}\`
          "
          gh release edit "${GITHUB_REF_NAME}" --notes "${notes}"
